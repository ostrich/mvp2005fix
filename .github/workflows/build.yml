name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install --yes mingw-w64

      - name: Build
        run: make release

      - name: Package build
        run: |
          mkdir -p dist
          cp release/mvp2005fix.exe release/mvp2005fix.dll README.md LICENSE dist/
          (cd dist && zip mvp2005fix-windows-x86.zip mvp2005fix.exe mvp2005fix.dll README.md LICENSE)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvp2005fix-windows-x86
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: mvp2005fix-windows-x86
          path: dist

      - name: Name versioned archive
        run: mv dist/mvp2005fix-windows-x86.zip "dist/mvp2005fix-${GITHUB_REF_NAME}-windows-x86.zip"

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "mvp2005fix $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/mvp2005fix.exe \
            dist/mvp2005fix.dll \
            "dist/mvp2005fix-${GITHUB_REF_NAME}-windows-x86.zip" \
            --clobber
