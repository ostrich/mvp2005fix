name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build and test tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes mingw-w64 wine wine32:i386 xvfb xauth

      - name: Build
        run: make release test-build

      - name: Run regression tests
        timeout-minutes: 5
        env:
          WINEPREFIX: ${{ runner.temp }}/mvp2005fix-test-prefix
          WINEARCH: win32
          WINEDEBUG: -all
        run: |
          xvfb-run -a sh -ec '
            wineboot -u
            wine release/inline-hooks-test.exe
            wine release/startup-test.exe
          '

      - name: Package build
        run: |
          mkdir -p dist
          cp release/mvp2005fix.exe release/mvp2005fix.dll README.md LICENSE dist/
          (cd dist && zip mvp2005fix-windows-x86.zip mvp2005fix.exe mvp2005fix.dll README.md LICENSE)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvp2005fix-windows-x86
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: mvp2005fix-windows-x86
          path: dist

      - name: Name versioned archive
        run: mv dist/mvp2005fix-windows-x86.zip "dist/mvp2005fix-${GITHUB_REF_NAME}-windows-x86.zip"

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "mvp2005fix $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "dist/mvp2005fix-${GITHUB_REF_NAME}-windows-x86.zip" \
            --clobber

  publish-master:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: mvp2005fix-windows-x86
          path: dist

      - name: Name master archive
        run: mv dist/mvp2005fix-windows-x86.zip dist/mvp2005fix-master-windows-x86.zip

      - name: Publish latest master build
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view master-build; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/master-build" \
              -f sha="$GITHUB_SHA" \
              -F force=true
          else
            gh release create master-build \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Latest master build" \
              --notes "Automated development build from the latest successful master commit. These files are replaced after every successful master build."
          fi
          gh release upload master-build \
            dist/mvp2005fix-master-windows-x86.zip \
            --clobber
